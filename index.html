<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculadoras TypeScript</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>

<body>

    <div class="contenedor-calculadoras">

        <div class="calculadora">

            <h1>Calculadora 1</h1>

            <input
                type="text"
                class="pantalla"
                readonly
            >

            <div class="botones">

                <button>C</button>
                <button>÷</button>
                <button>×</button>
                <button>-</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>+</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>=</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>0</button>

            </div>

        </div>


        <div class="calculadora">

            <h1>Calculadora 2</h1>

            <input
                type="text"
                class="pantalla"
                readonly
            >

            <div class="botones">

                <button>C</button>
                <button>÷</button>
                <button>×</button>
                <button>-</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>+</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>=</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>0</button>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="dist/index.js"
    ></script>

</body>

</html>
